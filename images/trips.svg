<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="#f7a440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="folder"><path d="M0 1.5 Q0 0 1.5 0 H5 L6.5 2 H12.5 Q14 2 14 3.5 V10.5 Q14 12 12.5 12 H1.5 Q0 12 0 10.5 Z" fill="#8c959f"/></g>
    <g id="doc"><path d="M0.5 0.5 H8 L11.5 4 V13.5 H0.5 Z M8 0.5 V4 H11.5" fill="#ffffff" stroke="#8c959f"/><path d="M3 6.5 H9 M3 8.75 H9 M3 11 H7" stroke="#8c959f" stroke-linecap="round"/></g>
  </defs>
  <style>
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .s { fill: #8c959f; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .n { font-size: 13px; font-weight: 700; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .key { font-size: 12px; fill: #1f6fb2; font-weight: 600; }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#ffffff" stroke="#d0d7de"/>

  <path d="M263 62 Q324 57 385 60" fill="none" stroke="#ffb054" stroke-width="4" stroke-linecap="round"/>
  <text x="40" y="54" font-size="26" font-weight="700" class="t">Plan every trip the same way, in your own notes.</text>
  <text x="40" y="84" font-size="15" class="m">Trips builds each trip from your own templates and fills in the folders, dates, links and day sections. You write the plan.</text>

  <!-- 1 · Create -->
  <rect x="40" y="112" width="280" height="440" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
  <circle cx="66" cy="142" r="12" fill="#ffb054"/><text x="66" y="147" text-anchor="middle" class="n">1</text>
  <text x="86" y="147" class="h">Create a trip</text>

  <rect x="58" y="166" width="244" height="270" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="72" y="194" font-size="14" font-weight="600" class="t">New Advanced trip</text>
  <text x="72" y="224" font-size="12" class="m">Name</text>
  <rect x="72" y="231" width="216" height="28" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="250" font-size="13" class="t">South Korea</text>
  <text x="72" y="284" font-size="12" class="m">Start date</text>
  <rect x="72" y="291" width="216" height="28" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="310" class="mono t">2026-04-29</text>
  <text x="72" y="344" font-size="12" class="m">End date</text>
  <rect x="72" y="351" width="216" height="28" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="370" class="mono t">2026-06-01</text>
  <rect x="148" y="396" width="64" height="28" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="180" y="415" text-anchor="middle" font-size="13" class="t">Cancel</text>
  <rect x="220" y="396" width="68" height="28" rx="5" fill="#1f6fb2"/>
  <text x="254" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Create</text>

  <text x="58" y="472" font-size="14" class="m">Choose a simple trip, a trip with</text>
  <text x="58" y="492" font-size="14" class="m">day plans and activities, or a</text>
  <text x="58" y="512" font-size="14" class="m">roadtrip. Each uses your template.</text>

  <!-- 2 · Structure -->
  <rect x="352" y="112" width="400" height="440" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
  <circle cx="378" cy="142" r="12" fill="#ffb054"/><text x="378" y="147" text-anchor="middle" class="n">2</text>
  <text x="398" y="147" class="h">Get the same structure every time</text>

  <rect x="370" y="166" width="364" height="214" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <g font-size="13">
    <use href="#folder" x="384" y="180"/><text x="404" y="191" class="t">Travel</text>
    <use href="#folder" x="404" y="202"/><text x="424" y="213" class="t">2026</text>
    <text x="720" y="213" text-anchor="end" class="key">sorted by year</text>
    <use href="#folder" x="424" y="224"/><text x="444" y="235" class="t">South Korea</text>
    <use href="#doc" x="445" y="244"/><text x="464" y="257" font-weight="600" class="t">South Korea.md</text>
    <text x="720" y="257" text-anchor="end" class="key">dates filled in</text>
    <use href="#folder" x="444" y="268"/><text x="464" y="279" class="t">Planning</text>
    <use href="#doc" x="465" y="288"/><text x="484" y="301" class="t">Busan.md</text>
    <text x="720" y="301" text-anchor="end" class="key">in the trip's folder</text>
    <use href="#doc" x="465" y="310"/><text x="484" y="323" class="t">Seoul.md</text>
    <use href="#folder" x="444" y="334"/><text x="464" y="345" class="t">Activities</text>
    <use href="#doc" x="465" y="354"/><text x="484" y="367" class="t">Gwangalli Beach.md</text>
  </g>

  <rect x="370" y="396" width="364" height="112" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <g font-size="12" class="s">
    <text x="384" y="418">Name</text><text x="560" y="418">Start</text><text x="648" y="418">End</text>
  </g>
  <line x1="370" y1="428" x2="734" y2="428" stroke="#eaeef2"/>
  <g font-size="13">
    <text x="384" y="450" class="t">Seoul</text><text x="560" y="450" class="mono m">04-29</text><text x="648" y="450" class="mono m">05-05</text>
    <text x="384" y="474" class="t">Gyeongju</text><text x="560" y="474" class="mono m">05-05</text><text x="648" y="474" class="mono m">05-09</text>
    <text x="384" y="498" class="t">Busan</text><text x="560" y="498" class="mono m">05-09</text><text x="648" y="498" class="mono m">05-16</text>
  </g>
  <text x="370" y="534" font-size="14" class="m">The trip note lists the plan, on desktop and phone.</text>

  <!-- 3 · Plan -->
  <rect x="784" y="112" width="376" height="440" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
  <circle cx="810" cy="142" r="12" fill="#ffb054"/><text x="810" y="147" text-anchor="middle" class="n">3</text>
  <text x="830" y="147" class="h">Add day plans and activities</text>

  <rect x="802" y="166" width="340" height="124" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="816" y="188" font-size="13" font-weight="600" class="t">New Planning</text>
  <text x="816" y="216" font-size="12" class="m">Name</text>
  <rect x="890" y="200" width="238" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="898" y="217" font-size="13" class="t">Busan</text>
  <text x="816" y="246" font-size="12" class="m">Dates</text>
  <rect x="890" y="230" width="238" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="898" y="247" class="mono t" font-size="12">2026-05-09 → 2026-05-16</text>
  <text x="816" y="276" font-size="12" class="m">Activities</text>
  <rect x="890" y="260" width="238" height="24" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="898" y="277" font-size="13" class="t">Gwangalli Beach</text>
  <text x="1120" y="277" text-anchor="end" class="mono s" font-size="12">05-09</text>

  <path d="M972 293 V315" stroke="#f7a440" stroke-width="2" stroke-linecap="round" marker-end="url(#flow)"/>

  <rect x="802" y="318" width="340" height="216" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <use href="#doc" x="816" y="329"/><text x="836" y="341" font-size="13" font-weight="600" class="t">Busan.md</text>
  <line x1="802" y1="352" x2="1142" y2="352" stroke="#eaeef2"/>
  <g class="mono" style="font-size:11.5px">
    <text x="816" y="374" class="s">---</text>
    <text x="816" y="392" class="t">backlink: "[[South Korea]]"</text>
    <text x="816" y="410" class="t">startDate: 2026-05-09</text>
    <text x="816" y="428" class="t">endDate: 2026-05-16</text>
    <text x="816" y="446" class="s">---</text>
    <text x="816" y="470" class="t">## 2026-05-09</text>
    <text x="816" y="488" class="t">### Activities</text>
    <text x="816" y="506" class="t">- [[Gwangalli Beach]]</text>
    <text x="816" y="524" class="s">## 2026-05-10 …</text>
  </g>
  <g text-anchor="end">
    <text x="1130" y="392" class="key">linked to the trip</text>
    <text x="1130" y="419" class="key">dates from the form</text>
    <text x="1130" y="470" class="key">a section for each day</text>
    <text x="1130" y="506" class="key">under its day</text>
  </g>

  <text x="40" y="600" font-size="14" class="m"><tspan font-weight="600" class="t">Plans change?</tspan> Drag day plans and activities to other days in the trip tab. Trips updates every note involved, and you can undo it.</text>
</svg>
